<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #message { position: fixed; inset: auto 0 45% 0; margin: 0 auto; max-width: 32em; padding: 0 1em;
    color: #ccc; font: 16px/1.4 -apple-system, system-ui, sans-serif; text-align: center; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Presentation"></svg>
<p id="message" hidden></p>
<script src="player.js"></script>
</body>
</html>
